  ```diff
  --- a/src/app.js
  +++ b/src/app.js
  @@ -1,8 +1,14 @@
   const express = require('express');
   const app = express();
  +const { warmCache } = require('./cache/productCache');

   app.use(express.json());
   app.use('/api/products', require('./routes/products'));

