  Provide a thorough code review. For each issue, state the severity (critical, warning,
  nit) and provide a concrete fix. Also call out what the PR does well.

eval_criteria:
  - identifies the race condition in invalidateProduct (redis.keys + del is not atomic, new keys can appear between the two calls)
  - identifies that redis errors are unhandled and will crash the process (no try/catch around redis calls, no error event listener on the redis client)
  - identifies the N+1 pattern in warmCache (sequential awaits in a for loop instead of pipeline/mget)
  - identifies the hardcoded TTL that should be configurable via environment variable
  - correctly prioritizes these issues by severity (crash > race condition > perf > config)
  - acknowledges the good patterns (centralized key generators, clean cache-aside pattern, proper invalidation on all write paths)
  - provides actionable fix suggestions with code, not just descriptions of problems
  - does not over-index on style nitpicks while missing the real bugs
  - catches that warmCache in the listen callback could delay server readiness or fail silently

expected_behavior: |
  Should flag 3-4 real bugs in priority order: (1) no error handling on Redis — if Redis
  goes down the entire API throws unhandled promise rejections; (2) race condition in
  invalidateProduct using KEYS + DEL (should use SCAN + pipeline or a key prefix with
  wildcard DEL); (3) warmCache uses sequential awaits instead of Redis pipeline, and
  runs in the listen callback where failures are swallowed; (4) hardcoded TTL.
  Should praise the centralized key generators, clean separation of cache logic from
  routes, and the fact that all write paths invalidate correctly. Should not spend
  significant review time on formatting or naming when there are real bugs to discuss.

