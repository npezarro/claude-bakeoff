name: code-review
description: Review a PR diff that adds an API caching layer, identifying real bugs and acknowledging good patterns

prompt: |
  Review the following PR diff. The developer is adding a Redis caching layer to an
  Express API that serves product data. Provide a thorough code review with issues
  prioritized by severity.

  **PR title:** "Add Redis caching to product endpoints for faster reads"
  **PR description:** "Adds a cache-aside pattern to our product API. Cache is warmed
  on startup and invalidated on writes. Reduces p95 latency from ~800ms to ~50ms
  for product list and detail endpoints."

  **Diff:**

  ```diff
  --- /dev/null
  +++ b/src/cache/productCache.js
  @@ -0,0 +1,89 @@
  +const Redis = require('ioredis');
  +const db = require('../db/pool');
  +
  +const redis = new Redis(process.env.REDIS_URL);
  +const CACHE_TTL = 3600; // 1 hour
  +
  +/**
  + * Cache key generators — centralized to avoid key mismatches
  + */
  +const keys = {
  +  productList: () => 'products:list',
  +  productDetail: (id) => `products:${id}`,
  +  productsByCategory: (cat) => `products:category:${cat}`,
  +};
  +
  +/**
  + * Get a product from cache, falling back to DB
  + */
  +async function getProduct(productId) {
  +  const cached = await redis.get(keys.productDetail(productId));
  +  if (cached) {
  +    return JSON.parse(cached);
  +  }
  +
  +  const { rows } = await db.query(
  +    'SELECT * FROM products WHERE id = $1',
  +    [productId]
  +  );
  +  const product = rows[0];
  +
  +  if (product) {
  +    await redis.setex(keys.productDetail(productId), CACHE_TTL, JSON.stringify(product));
  +  }
  +
  +  return product;
  +}
  +
  +/**
  + * Get all products, cached as a single list
  + */
  +async function getProducts() {
  +  const cached = await redis.get(keys.productList());
  +  if (cached) {
  +    return JSON.parse(cached);
  +  }
  +
  +  const { rows } = await db.query('SELECT * FROM products ORDER BY created_at DESC');
  +  await redis.setex(keys.productList(), CACHE_TTL, JSON.stringify(rows));
  +  return rows;
  +}
  +
  +/**
  + * Invalidate all product caches when data changes
  + */
  +async function invalidateProduct(productId) {
  +  await redis.del(keys.productDetail(productId));
  +  await redis.del(keys.productList());
  +  // Also clear category caches
  +  const categoryKeys = await redis.keys('products:category:*');
  +  if (categoryKeys.length > 0) {
  +    await redis.del(...categoryKeys);
  +  }
  +}
  +
  +/**
  + * Warm the cache on startup with all products
  + */
  +async function warmCache() {
  +  console.log('Warming product cache...');
  +  const { rows: products } = await db.query('SELECT * FROM products ORDER BY created_at DESC');
  +
  +  // Cache the full list
  +  await redis.setex(keys.productList(), CACHE_TTL, JSON.stringify(products));
  +
  +  // Cache each individual product
  +  for (const product of products) {
  +    await redis.setex(keys.productDetail(product.id), CACHE_TTL, JSON.stringify(product));
  +  }
  +
  +  // Cache by category
  +  const categories = [...new Set(products.map(p => p.category))];
  +  for (const category of categories) {
  +    const catProducts = products.filter(p => p.category === category);
  +    await redis.setex(keys.productsByCategory(category), CACHE_TTL, JSON.stringify(catProducts));
  +  }
  +
  +  console.log(`Cache warmed: ${products.length} products across ${categories.length} categories`);
  +}
  +
  +module.exports = { getProduct, getProducts, invalidateProduct, warmCache, keys };
  ```

  ```diff
  --- a/src/routes/products.js
  +++ b/src/routes/products.js
  @@ -1,28 +1,20 @@
   const express = require('express');
   const router = express.Router();
  -const db = require('../db/pool');
  +const cache = require('../cache/productCache');
  +const db = require('../db/pool');

   router.get('/', async (req, res, next) => {
     try {
  -    const { rows } = await db.query('SELECT * FROM products ORDER BY created_at DESC');
  -    res.json(rows);
  +    const products = await cache.getProducts();
  +    res.json(products);
     } catch (err) {
       next(err);
     }
   });

   router.get('/:id', async (req, res, next) => {
     try {
  -    const { rows } = await db.query('SELECT * FROM products WHERE id = $1', [req.params.id]);
  -    if (!rows[0]) return res.status(404).json({ error: 'Not found' });
  -    res.json(rows[0]);
  +    const product = await cache.getProduct(req.params.id);
  +    if (!product) return res.status(404).json({ error: 'Not found' });
  +    res.json(product);
     } catch (err) {
       next(err);
