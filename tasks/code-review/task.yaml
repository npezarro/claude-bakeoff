       const { title, description, price, category } = req.body;
       const { rows } = await db.query(
         'INSERT INTO products (title, description, price, category) VALUES ($1, $2, $3, $4) RETURNING *',
         [title, description, price, category]
       );
  +    await cache.invalidateProduct(rows[0].id);
       res.status(201).json(rows[0]);
     } catch (err) {
       next(err);
     }
   });

   router.put('/:id', async (req, res, next) => {
     try {
       const { title, description, price, category } = req.body;
       const { rows } = await db.query(
         'UPDATE products SET title=$1, description=$2, price=$3, category=$4 WHERE id=$5 RETURNING *',
         [title, description, price, category, req.params.id]
       );
       if (!rows[0]) return res.status(404).json({ error: 'Not found' });
  +    await cache.invalidateProduct(req.params.id);
       res.json(rows[0]);
     } catch (err) {
       next(err);
     }
